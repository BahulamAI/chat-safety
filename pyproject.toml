[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-safety"
version = "0.1.0a0"
description = "Typed, provider-neutral risk assessments for conversational applications"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "BahulamAI"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

[project.optional-dependencies]
jev = ["httpx>=0.27,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.urls]
Repository = "https://github.com/BahulamAI/chat-safety"
Issues = "https://github.com/BahulamAI/chat-safety/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chat_safety = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
